<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medicode Solutions — Tecnología clínica</title>
  <meta name="description" content="Calculadoras clínicas, educación interactiva y preparación ENARM. Ropi Calc, AnesthTR y EnarmTR — hechos por médicos mexicanos." />
  <meta property="og:title" content="Medicode Solutions" />
  <meta property="og:description" content="Ropi Calc, AnesthTR, EnarmTR — herramientas digitales para médicos." />
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #060914;
      color: #e8efff;
      font-family: 'Geist', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }
    a { color: inherit; }
    svg { display: block; }
  </style>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
// Shared utilities for all three Medicode landing variations.
// Brand marks, phone mockups, icon set, and palettes.

// ──────────────────────────────────────────────────────────────
// Brand marks
// ──────────────────────────────────────────────────────────────

// Parent Medicode mark — hex with stylized EKG/M pulse.
// Distinct from AnesthTR (which is hex + circuit tree).
function MedicodeMark({ size = 32, stroke = '#fff', fill = 'none', glow = false }) {
  const w = size, h = size * 1.06;
  return (
    <svg width={w} height={h} viewBox="0 0 32 34" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ display: 'block', filter: glow ? `drop-shadow(0 0 8px ${stroke}55)` : 'none' }}>
      <polygon points="16,1.5 28.5,8.75 28.5,25.25 16,32.5 3.5,25.25 3.5,8.75" stroke={stroke} strokeWidth="1.4" fill={fill} strokeLinejoin="round"/>
      {/* M-shaped pulse */}
      <path d="M8 18 L11 18 L13 12 L16 22 L19 12 L21 18 L24 18" stroke={stroke} strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
    </svg>
  );
}

// AnesthTR mark — hex + circuit tree (matches the real logo).
function AnesthTRMark({ size = 32, color = '#5bb0ff' }) {
  return (
    <svg width={size} height={size * 1.06} viewBox="0 0 32 34" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ display: 'block' }}>
      <defs>
        <linearGradient id={`atr-${color.replace('#','')}`} x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stopColor={color} stopOpacity="0.95"/>
          <stop offset="100%" stopColor={color} stopOpacity="0.55"/>
        </linearGradient>
      </defs>
      <polygon points="16,1.5 28.5,8.75 28.5,25.25 16,32.5 3.5,25.25 3.5,8.75" fill={`url(#atr-${color.replace('#','')})`} stroke={color} strokeOpacity="0.4" strokeWidth="0.8"/>
      <circle cx="10" cy="17" r="2" fill="#fff"/>
      <line x1="12.2" y1="17" x2="19" y2="11.5" stroke="#fff" strokeWidth="1.3" strokeLinecap="round"/>
      <line x1="12.2" y1="17" x2="19" y2="17" stroke="#fff" strokeWidth="1.3" strokeLinecap="round"/>
      <line x1="12.2" y1="17" x2="19" y2="22.5" stroke="#fff" strokeWidth="1.3" strokeLinecap="round"/>
      <circle cx="20" cy="11.5" r="1.5" fill="#fff"/>
      <circle cx="20" cy="17" r="1.5" fill="#fff"/>
      <circle cx="20" cy="22.5" r="1.5" fill="#fff"/>
    </svg>
  );
}

// Ropi Calc mark — droplet with calc grid
function RopiMark({ size = 32, color = '#3bd9a4' }) {
  return (
    <svg width={size} height={size * 1.06} viewBox="0 0 32 34" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ display: 'block' }}>
      <rect x="3" y="3" width="26" height="28" rx="6" stroke={color} strokeWidth="1.4" fill="none"/>
      <path d="M16 8.5 C13 12, 11 14.5, 11 17.5 C11 20.5, 13.2 22.5, 16 22.5 C18.8 22.5, 21 20.5, 21 17.5 C21 14.5, 19 12, 16 8.5 Z" fill={color} fillOpacity="0.18" stroke={color} strokeWidth="1.3"/>
      <line x1="13" y1="27" x2="19" y2="27" stroke={color} strokeWidth="1.3" strokeLinecap="round" opacity="0.6"/>
    </svg>
  );
}

// EnarmTR mark — book + cap
function EnarmMark({ size = 32, color = '#c084fc' }) {
  return (
    <svg width={size} height={size * 1.06} viewBox="0 0 32 34" fill="none" xmlns="http://www.w3.org/2000/svg" style={{ display: 'block' }}>
      <rect x="3" y="3" width="26" height="28" rx="6" stroke={color} strokeWidth="1.4" fill="none"/>
      <path d="M16 10 L24 14 L16 18 L8 14 Z" fill={color} fillOpacity="0.18" stroke={color} strokeWidth="1.3" strokeLinejoin="round"/>
      <path d="M11 16 L11 21 C11 22, 13 23, 16 23 C19 23, 21 22, 21 21 L21 16" stroke={color} strokeWidth="1.3" strokeLinecap="round" fill="none"/>
      <line x1="24" y1="14" x2="24" y2="20" stroke={color} strokeWidth="1.3" strokeLinecap="round"/>
    </svg>
  );
}

// ──────────────────────────────────────────────────────────────
// Phone mockup — Ropi Calc UI
// width/scale controls overall size
// ──────────────────────────────────────────────────────────────
function RopiCalcPhone({ width = 320, accent = '#3bd9a4', bg = '#0a0e14', cardBg = '#11161f', textColor = '#e8eef5', muted = '#7a8696', style = {} }) {
  const h = width * 2.05;
  const radius = width * 0.13;
  return (
    <div style={{
      width, height: h, borderRadius: radius,
      background: '#000',
      padding: width * 0.022,
      boxShadow: `0 40px 80px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.06), inset 0 0 0 1.5px rgba(255,255,255,0.04)`,
      position: 'relative',
      fontFamily: '"Geist", system-ui, sans-serif',
      ...style,
    }}>
      <div style={{
        width: '100%', height: '100%',
        borderRadius: radius - width * 0.022,
        background: bg,
        overflow: 'hidden',
        position: 'relative',
      }}>
        {/* notch */}
        <div style={{
          position: 'absolute', top: width * 0.025, left: '50%', transform: 'translateX(-50%)',
          width: width * 0.30, height: width * 0.055, borderRadius: width * 0.028, background: '#000', zIndex: 2,
        }} />
        {/* status bar */}
        <div style={{
          display: 'flex', justifyContent: 'space-between', padding: `${width*0.045}px ${width*0.07}px ${width*0.025}px`,
          fontSize: width*0.038, color: textColor, fontWeight: 600,
        }}>
          <span>9:41</span>
          <span style={{ display: 'flex', gap: 4, alignItems: 'center' }}>
            <span style={{ width: width*0.04, height: width*0.022, borderRadius: 1, background: textColor }} />
            <span style={{ width: width*0.05, height: width*0.022, borderRadius: 1, background: textColor }} />
            <span style={{ width: width*0.07, height: width*0.025, border: `1px solid ${textColor}`, borderRadius: 2, padding: 1 }}>
              <span style={{ display: 'block', width: '70%', height: '100%', background: textColor, borderRadius: 1 }} />
            </span>
          </span>
        </div>

        {/* app content */}
        <div style={{ padding: `${width*0.04}px ${width*0.055}px`, color: textColor }}>
          {/* header */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: width*0.06 }}>
            <div style={{ display: 'flex', flexDirection: 'column' }}>
              <span style={{ fontSize: width*0.030, color: muted, textTransform: 'uppercase', letterSpacing: '0.12em' }}>Calculadora</span>
              <span style={{ fontSize: width*0.058, fontWeight: 600, marginTop: 2 }}>Ropivacaína</span>
            </div>
            <div style={{
              width: width*0.10, height: width*0.10, borderRadius: '50%',
              background: `${accent}20`, border: `1px solid ${accent}40`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: width*0.04, color: accent, fontWeight: 600,
            }}>i</div>
          </div>

          {/* segmented */}
          <div style={{
            display: 'grid', gridTemplateColumns: '1fr 1fr 1fr',
            background: cardBg, padding: width*0.012, borderRadius: width*0.025, marginBottom: width*0.05,
            fontSize: width*0.034,
          }}>
            <div style={{ textAlign: 'center', padding: `${width*0.025}px 0`, background: accent, color: bg, borderRadius: width*0.018, fontWeight: 600 }}>Adulto</div>
            <div style={{ textAlign: 'center', padding: `${width*0.025}px 0`, color: muted }}>Pediátrico</div>
            <div style={{ textAlign: 'center', padding: `${width*0.025}px 0`, color: muted }}>Obstétrico</div>
          </div>

          {/* inputs */}
          <FieldRow label="Peso" value="70" unit="kg" w={width} accent={accent} cardBg={cardBg} muted={muted} textColor={textColor}/>
          <FieldRow label="Concentración" value="0.5" unit="%" w={width} accent={accent} cardBg={cardBg} muted={muted} textColor={textColor}/>
          <FieldRow label="Vía" value="Peridural" unit="" w={width} accent={accent} cardBg={cardBg} muted={muted} textColor={textColor} isChip/>

          {/* result */}
          <div style={{
            marginTop: width*0.06, padding: width*0.05, borderRadius: width*0.04,
            background: `linear-gradient(160deg, ${accent}22, ${accent}05)`,
            border: `1px solid ${accent}40`,
          }}>
            <div style={{ fontSize: width*0.030, color: muted, textTransform: 'uppercase', letterSpacing: '0.1em', marginBottom: width*0.02 }}>Dosis máxima</div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: width*0.02 }}>
              <span style={{ fontSize: width*0.10, fontWeight: 600, color: accent, fontFamily: '"Geist", system-ui' }}>210</span>
              <span style={{ fontSize: width*0.038, color: muted }}>mg</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: width*0.035, fontSize: width*0.034, color: muted }}>
              <span>Volumen</span>
              <span style={{ color: textColor, fontWeight: 500 }}>42 mL</span>
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: width*0.015, fontSize: width*0.034, color: muted }}>
              <span>Límite seguro</span>
              <span style={{ color: textColor, fontWeight: 500 }}>3 mg/kg</span>
            </div>
          </div>

          <div style={{ marginTop: width*0.04, padding: `${width*0.025}px ${width*0.04}px`, fontSize: width*0.030, color: muted, background: cardBg, borderRadius: width*0.025, borderLeft: `2px solid ${accent}` }}>
            Basado en guías ASRA 2023 · sin internet
          </div>
        </div>

        {/* home indicator */}
        <div style={{ position: 'absolute', bottom: width*0.03, left: '50%', transform: 'translateX(-50%)', width: width*0.35, height: width*0.012, background: textColor, opacity: 0.4, borderRadius: 4 }} />
      </div>
    </div>
  );
}

function FieldRow({ label, value, unit, w, accent, cardBg, muted, textColor, isChip }) {
  return (
    <div style={{
      display: 'flex', justifyContent: 'space-between', alignItems: 'center',
      padding: `${w*0.038}px ${w*0.045}px`,
      background: cardBg, borderRadius: w*0.03, marginBottom: w*0.02,
      border: '1px solid rgba(255,255,255,0.04)',
    }}>
      <span style={{ fontSize: w*0.036, color: muted }}>{label}</span>
      <span style={{ display: 'flex', alignItems: 'baseline', gap: w*0.015 }}>
        {isChip ? (
          <span style={{ fontSize: w*0.034, color: textColor, padding: `${w*0.012}px ${w*0.025}px`, background: `${accent}1f`, color: accent, borderRadius: w*0.015, fontWeight: 500 }}>{value}</span>
        ) : (
          <>
            <span style={{ fontSize: w*0.048, fontWeight: 600, color: textColor }}>{value}</span>
            <span style={{ fontSize: w*0.034, color: muted }}>{unit}</span>
          </>
        )}
      </span>
    </div>
  );
}

// ──────────────────────────────────────────────────────────────
// Icons
// ──────────────────────────────────────────────────────────────
const Ico = {
  pulse: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>,
  shield: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>,
  offline: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><circle cx="12" cy="20" r="0.5" fill="currentColor"/><path d="M2 2l20 20" stroke="currentColor"/></svg>,
  doctor: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="8" r="4"/><path d="M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>,
  cross: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 5v14M5 12h14"/></svg>,
  arrow: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M5 12h14M13 5l7 7-7 7"/></svg>,
  arrowUp: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M7 17L17 7M7 7h10v10"/></svg>,
  mx: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>,
  layers: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5M2 12l10 5 10-5"/></svg>,
  book: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V2H6.5A2.5 2.5 0 0 0 4 4.5v15z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/></svg>,
  bolt: (p) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round" {...p}><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>,
};



// Variation C — Showcase
// Cinematic, product-forward. Big floating Ropi Calc hero, bento grid.
// Space Grotesk display + Geist body.

const SH = {
  bg: '#060914',
  bg2: '#0b1124',
  bg3: '#101730',
  card: 'rgba(15,21,46,0.6)',
  text: '#e8efff',
  textDim: '#aab5cc',
  muted: '#6b7896',
  rule: 'rgba(120,160,255,0.10)',
  ruleStrong: 'rgba(120,160,255,0.22)',
  blue: '#2389f5',
  cyan: '#38d9f5',
  ropi: '#3bd9a4',
  enarm: '#c084fc',
  amber: '#ffbe32',
};

function ShowcaseLanding() {
  return (
    <div style={{
      width: '100%', minHeight: '100%',
      background: SH.bg, color: SH.text,
      fontFamily: '"Geist", system-ui, sans-serif',
      overflow: 'hidden', position: 'relative',
    }}>
      <ShBackdrop />
      <ShNav />
      <ShHero />
      <ShBento />
      <ShFeatures />
      <ShTestimonial />
      <ShCTA />
      <ShFooter />
    </div>
  );
}

// ── Backdrop: subtle radial gradients + grid
function ShBackdrop() {
  return (
    <>
      <div style={{
        position: 'absolute', top: -200, left: '50%', transform: 'translateX(-50%)',
        width: 1200, height: 800, pointerEvents: 'none', zIndex: 0,
        background: 'radial-gradient(ellipse at center, rgba(35,137,245,0.18) 0%, transparent 60%)',
        filter: 'blur(40px)',
      }} />
      <div style={{
        position: 'absolute', top: 600, right: -200,
        width: 700, height: 700, pointerEvents: 'none', zIndex: 0,
        background: 'radial-gradient(circle, rgba(59,217,164,0.15) 0%, transparent 60%)',
        filter: 'blur(60px)',
      }} />
      <div style={{
        position: 'absolute', inset: 0, pointerEvents: 'none',
        backgroundImage: `linear-gradient(rgba(120,160,255,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(120,160,255,0.04) 1px, transparent 1px)`,
        backgroundSize: '64px 64px',
        maskImage: 'radial-gradient(ellipse at center top, rgba(0,0,0,0.6) 0%, transparent 70%)',
        WebkitMaskImage: 'radial-gradient(ellipse at center top, rgba(0,0,0,0.6) 0%, transparent 70%)',
      }} />
    </>
  );
}

// ── Nav (floating pill)
function ShNav() {
  const lk = { color: SH.textDim, textDecoration: 'none', fontSize: 14 };
  return (
    <div style={{ padding: '24px 32px', position: 'relative', zIndex: 5 }}>
      <nav style={{
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        background: 'rgba(11,17,36,0.65)', backdropFilter: 'blur(20px)',
        border: `1px solid ${SH.rule}`, borderRadius: 999,
        padding: '12px 16px 12px 24px',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <MedicodeMark size={26} stroke={SH.cyan} glow />
          <span style={{ fontFamily: '"Space Grotesk", sans-serif', fontWeight: 600, fontSize: 17, letterSpacing: '-0.005em' }}>
            Medicode
          </span>
        </div>
        <div style={{ display: 'flex', gap: 32 }}>
          <a href="#" style={lk}>Productos</a>
          <a href="#" style={lk}>Ropi Calc</a>
          <a href="#" style={lk}>AnesthTR</a>
          <a href="#" style={lk}>Equipo</a>
        </div>
        <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
          <a href="#" style={{ ...lk, fontSize: 13 }}>Iniciar sesión</a>
          <a href="#" style={{
            background: `linear-gradient(135deg, ${SH.blue}, ${SH.cyan})`,
            color: '#04101e', fontWeight: 600, padding: '8px 18px', borderRadius: 999,
            textDecoration: 'none', fontSize: 13.5,
            boxShadow: `0 8px 24px rgba(35,137,245,0.4)`,
          }}>Descargar app ↗</a>
        </div>
      </nav>
    </div>
  );
}

// ── Hero
function ShHero() {
  return (
    <section style={{ padding: '60px 64px 100px', position: 'relative', zIndex: 1 }}>
      <div style={{ display: 'grid', gridTemplateColumns: '1.05fr 1fr', gap: 48, alignItems: 'center' }}>
        <div>
          {/* eyebrow */}
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 10,
            background: 'rgba(56,217,245,0.08)', border: `1px solid ${SH.cyan}40`,
            padding: '6px 14px', borderRadius: 999, marginBottom: 36,
          }}>
            <span style={{ width: 6, height: 6, background: SH.cyan, borderRadius: '50%', boxShadow: `0 0 8px ${SH.cyan}` }} />
            <span style={{ fontSize: 12, color: SH.cyan, letterSpacing: '0.08em', fontWeight: 500 }}>NUEVO · Ropi Calc con 16 calculadoras disponible</span>
          </div>

          <h1 style={{
            fontFamily: '"Space Grotesk", sans-serif', fontWeight: 700,
            fontSize: 88, lineHeight: 0.98, letterSpacing: '-0.035em', margin: 0,
          }}>
            La caja de<br/>herramientas del<br/>
            <span style={{
              background: `linear-gradient(120deg, ${SH.cyan}, ${SH.blue} 60%, ${SH.ropi})`,
              WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
              backgroundClip: 'text',
            }}>anestesiólogo</span>
            <br/>moderno.
          </h1>

          <p style={{ fontSize: 18, lineHeight: 1.6, color: SH.textDim, marginTop: 32, maxWidth: 480 }}>
            Calculadoras clínicas, educación interactiva y preparación ENARM —
            tres plataformas hechas por médicos mexicanos para médicos mexicanos.
          </p>

          <div style={{ display: 'flex', gap: 14, marginTop: 40 }}>
            <a href="#ropi" style={{
              background: `linear-gradient(135deg, ${SH.blue}, ${SH.cyan})`,
              color: '#04101e', fontWeight: 600, padding: '14px 26px', borderRadius: 12,
              textDecoration: 'none', fontSize: 15, display: 'inline-flex', alignItems: 'center', gap: 8,
              boxShadow: `0 12px 32px rgba(35,137,245,0.35)`,
            }}>Probar Ropi Calc <span>→</span></a>
            <a href="#" style={{
              border: `1px solid ${SH.ruleStrong}`, color: SH.text,
              padding: '14px 26px', borderRadius: 12,
              textDecoration: 'none', fontSize: 15, fontWeight: 500,
              background: 'rgba(255,255,255,0.02)',
            }}>Ver todos los productos</a>
